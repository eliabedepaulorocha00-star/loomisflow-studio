name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # gera android/ e ios/, aplica permissões e roda pub get
      - name: Preparar plataformas
        run: ./tool/setup_platforms.sh

      # testes não bloqueiam o APK (o código ainda não foi validado em máquina com Flutter)
      - name: Testes
        run: flutter test
        continue-on-error: true

      - name: Compilar APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: loomisflow-apk
          path: build/app/outputs/flutter-apk/*.apk

      # publica em "Releases" para baixar direto do celular, sem login
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LoomisFlow Studio build ${{ github.run_number }}
          body: >-
            Instale o app-arm64-v8a-release.apk (serve para quase todo celular Android atual).
          files: build/app/outputs/flutter-apk/*.apk
