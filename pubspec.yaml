name: loomisflow_studio
description: App gratuito e ilimitado de construção Loomis com IA local, decalque na tela e AR.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.11.0
  path_provider: ^2.1.4
  path: ^1.9.0
  share_plus: ^10.0.2
  image: ^4.2.0
  wakelock_plus: ^1.2.8
  http: ^1.2.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/library/
